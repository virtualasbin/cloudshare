<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudShare</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout-shell">
      <aside class="left-rail">
        <h2>CloudShare</h2>
        <nav class="rail-nav">
          <button class="rail-item active" type="button">Library</button>
          <button class="rail-item" type="button">Upload</button>
          <button class="rail-item" type="button">Edit</button>
          <button class="rail-item" type="button">Settings</button>
        </nav>
        <div class="rail-footer">Azure Multimedia Platform</div>
      </aside>

      <section class="main-area">
        <header class="topbar">
          <div>
            <p class="hero-kicker">CLOUD NATIVE STORAGE STUDIO</p>
            <h1>Manage your multimedia assets smarter.</h1>
          </div>
          <span id="connectionStatus" class="status-badge" data-status="idle">Not Connected</span>
        </header>

        <section class="stats-grid">
          <article class="stat-card">
            <span>Total</span>
            <strong id="statTotal">0</strong>
          </article>
          <article class="stat-card">
            <span>Images</span>
            <strong id="statImages">0</strong>
          </article>
          <article class="stat-card">
            <span>Videos</span>
            <strong id="statVideos">0</strong>
          </article>
          <article class="stat-card">
            <span>Other</span>
            <strong id="statOther">0</strong>
          </article>
        </section>

        <section class="workspace">
          <article class="panel">
            <h2>Upload To Library</h2>
            <form id="uploadForm" class="form-grid">
              <label for="assetName">Asset Name</label>
              <input id="assetName" type="text" required />
              <label for="assetType">Content Type</label>
              <input id="assetType" type="text" value="image/png" required />
              <label for="assetTags">Tags</label>
              <input id="assetTags" type="text" placeholder="travel, banner, social" />
              <label class="dropzone" for="assetFile">
                <span>Drop file here or click to browse</span>
                <small id="selectedFileText">No file selected</small>
              </label>
              <input id="assetFile" type="file" accept="image/*,video/*" required />
              <button id="uploadButton" type="submit">Upload To Library</button>
            </form>
          </article>

          <article class="panel side-tools">
            <h2>Quick Edit</h2>
            <form id="updateForm" class="form-grid">
              <label for="updateAssetId">Asset ID</label>
              <input id="updateAssetId" type="text" required />
              <label for="updateAssetName">New Name</label>
              <input id="updateAssetName" type="text" />
              <label for="updateAssetType">New Content Type</label>
              <input id="updateAssetType" type="text" />
              <label for="updateAssetTags">New Tags</label>
              <input id="updateAssetTags" type="text" />
              <button id="updateButton" type="submit">Save Changes</button>
            </form>
          </article>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Library Gallery</h2>
            <div class="list-tools">
              <input id="searchAssets" type="search" placeholder="Search by name, tag, id..." />
              <select id="filterType">
                <option value="all">All</option>
                <option value="image">Images</option>
                <option value="video">Videos</option>
                <option value="other">Other</option>
              </select>
              <button id="refreshAssets" class="button-secondary" type="button">Refresh</button>
            </div>
          </div>
          <ul id="assetList" class="gallery-grid"></ul>
          <p id="emptyState" class="empty-state">Nothing here yet. Upload a file to get started.</p>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Activity Log</h2>
            <button id="clearLog" class="button-secondary" type="button">Clear</button>
          </div>
          <pre id="logOutput"></pre>
        </section>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
